<svg xmlns="http://www.w3.org/2000/svg" class="project-cover" width="1600" height="1000" viewBox="0 0 1600 1000" color="var(--cover-line, #6D28D9)" focusable="false" aria-hidden="true">
  <rect width="1600" height="1000" fill="var(--cover-bg, #EDE5FA)"/>
  <path d="M72 206V72H222 M1378 928h150V794 M72 856H1528" stroke="currentColor" stroke-width="1.5" fill="none" opacity=".5"/>
  <g data-cover-art="" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Day strip: hour ticks + busy blocks + free windows -->
    <rect x="220" y="320" width="1160" height="420" rx="9" fill="var(--cover-bg, #EDE5FA)" stroke="currentColor" vector-effect="non-scaling-stroke"/>
    <path d="M248 400 H1352" fill="none" stroke="currentColor" opacity=".35" vector-effect="non-scaling-stroke"/>
    <!-- hour labels -->
    <g fill="currentColor" opacity=".55" font-family="ui-monospace, monospace" font-size="16">
      <text x="248" y="430">10</text>
      <text x="380" y="430">11</text>
      <text x="512" y="430">12</text>
      <text x="644" y="430">13</text>
      <text x="776" y="430">14</text>
      <text x="908" y="430">15</text>
      <text x="1040" y="430">16</text>
      <text x="1172" y="430">17</text>
      <text x="1304" y="430">18</text>
    </g>
    <path d="M248 448 H1352" fill="none" stroke="currentColor" opacity=".25" vector-effect="non-scaling-stroke"/>
    <!-- busy visits -->
    <rect x="248" y="470" width="120" height="72" rx="8" fill="#8B5CF6" stroke="none"/>
    <rect x="400" y="470" width="180" height="72" rx="8" fill="#8B5CF6" stroke="none"/>
    <rect x="720" y="470" width="120" height="72" rx="8" fill="#8B5CF6" stroke="none"/>
    <rect x="1000" y="470" width="90" height="72" rx="8" fill="#8B5CF6" stroke="none"/>
    <!-- free windows (outline) -->
    <rect x="580" y="470" width="120" height="72" rx="8" fill="none" stroke="currentColor" opacity=".7" vector-effect="non-scaling-stroke"/>
    <rect x="860" y="470" width="120" height="72" rx="8" fill="none" stroke="currentColor" opacity=".7" vector-effect="non-scaling-stroke"/>
    <rect x="1110" y="470" width="220" height="72" rx="8" fill="none" stroke="currentColor" opacity=".7" vector-effect="non-scaling-stroke"/>
    <!-- status chips -->
    <rect x="248" y="590" width="160" height="44" rx="8" fill="none" stroke="currentColor" vector-effect="non-scaling-stroke"/>
    <rect x="428" y="590" width="160" height="44" rx="8" fill="#8B5CF6" stroke="none"/>
    <rect x="608" y="590" width="180" height="44" rx="8" fill="none" stroke="currentColor" vector-effect="non-scaling-stroke"/>
    <path d="M248 680 H900" fill="none" stroke="currentColor" opacity=".3" vector-effect="non-scaling-stroke"/>
    </g>
</svg>
