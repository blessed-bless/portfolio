      <rect x="0" y="20" width="220" height="48" rx="8"/>
      <path d="M28 20 V0 M56 20 V0 M84 20 V0 M112 20 V0 M140 20 V0 M168 20 V0 M196 20 V0"/>
    </g>
    <!-- Accent mark -->
