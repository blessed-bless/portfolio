<svg xmlns="http://www.w3.org/2000/svg" class="project-cover" width="1600" height="1000" viewBox="0 0 1600 1000" color="var(--cover-line, #C4A484)" focusable="false" aria-hidden="true">
  <rect width="1600" height="1000" fill="var(--cover-bg, #1B1713)"/>
