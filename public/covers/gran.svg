  <path d="M72 206V72H222 M1378 928h150V794 M72 856H1528" stroke="currentColor" stroke-width="1.5" fill="none" opacity=".45"/>
  <g data-cover-art="" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Barber pole stripes -->
    <rect x="380" y="240" width="72" height="520" rx="6" fill="#1B1713" stroke="none"/>
    <path d="M380 300 H452 M380 360 H452 M380 420 H452 M380 480 H452 M380 540 H452 M380 600 H452 M380 660 H452 M380 720 H452" stroke="#B8742A" stroke-width="18" opacity=".9"/>
